<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>View PR Updates</title>
    <!-- The stylesheets, one per area (UI_REDESIGN_PLAN.md). tokens.css
         comes first: the others use its variables. common.css through
         snackbar.css were index.css (phase 10-1) and keep its place in the
         order, before ui.css. -->
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/common.css" />
    <link rel="stylesheet" href="./styles/multi-select.css" />
    <link rel="stylesheet" href="./styles/settings-sections.css" />
    <link rel="stylesheet" href="./styles/activity.css" />
    <link rel="stylesheet" href="./styles/review-stats.css" />
    <link rel="stylesheet" href="./styles/author-insights.css" />
    <link rel="stylesheet" href="./styles/insights.css" />
    <link rel="stylesheet" href="./styles/snackbar.css" />
    <link rel="stylesheet" href="./styles/ui.css" />
    <link rel="stylesheet" href="./styles/pr-table.css" />
    <link rel="stylesheet" href="./styles/pane.css" />
    <link rel="stylesheet" href="./styles/filter-bar.css" />
    <link rel="stylesheet" href="./styles/shell.css" />
    <link rel="stylesheet" href="./styles/settings.css" />
</head>

<body>
    <!-- react-app.tsx renders the whole page here (components/shell/AppShell.tsx). -->
    <div id="app-root"></div>

    <!-- Vendored copy of node_modules/marked/lib/marked.umd.js: both the Vite
         dev server and the standalone Express server serve static files
         rooted at src/ui, so a path into the repo-root node_modules/ 404s
         under either. Re-copy from node_modules/marked/lib/marked.umd.js
         when bumping the "marked" dependency version - and re-copy
         marked.umd.js.map (node_modules/marked/lib/marked.umd.js.map) at
         the same time, or Vite's dev server logs a source-map ENOENT for
         every request once the two drift out of sync (the .js file's own
         trailing `//# sourceMappingURL=marked.umd.js.map` comment expects
         it to sit right next to it). -->
    <script src="./vendor/marked.umd.js"></script>
    <!-- Vendored copy of node_modules/dompurify/dist/purify.min.js, for the
         same reason as marked.umd.js above (static files are served rooted
         at src/ui, so a node_modules/ path 404s). Sanitizes the HTML returned
         by the optional custom "More Insights" hook script (see
         InsightsHookSection.jsx / VIEW_PRS_INSIGHTS_HOOK_SCRIPT) before it's
         rendered - that script is user-provided and arbitrary, so its output
         is treated as untrusted. Re-copy purify.min.js and purify.min.js.map
         together when bumping the "dompurify" dependency version. -->
    <script src="./vendor/purify.min.js"></script>
    <!-- The app (it installs its error filters before mounting). -->
    <script type="module" src="./react-app.tsx"></script>
</body>

</html>
