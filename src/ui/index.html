<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>View PR Updates</title>
    <!-- Stylesheets for the UI redesign (UI_REDESIGN_PLAN.md) live in
         ./styles/; index.css is split into them area by area as each area
         is rewritten. tokens.css comes first: the others use its
         variables. -->
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="./styles/ui.css" />
    <link rel="stylesheet" href="./styles/pr-table.css" />
    <link rel="stylesheet" href="./styles/pane.css" />
    <link rel="stylesheet" href="./styles/filter-bar.css" />
    <link rel="stylesheet" href="./styles/shell.css" />
    <link rel="stylesheet" href="./styles/settings.css" />
</head>

<body>
    <!-- Rendered by React (Snackbar.jsx, mounted in react-app.jsx) - a full
         subtree, not just children: the outer #error-snackbar element's own
         `hidden`/variant class need toggling, which only works if React owns
         that element itself, not just what's inside it (a portal only owns
         its target's children) - see REACT_MIGRATION_PLAN.md's full
         vanilla-to-React sweep. -->
    <div id="error-snackbar-root"></div>
    <!-- Rendered by React (ActivityDrawer.jsx, mounted in react-app.jsx) -
         the collapsible background-activity panel. Always mounted so its
         toggle's live count stays accurate while the panel is closed. -->
    <div id="activity-drawer-root"></div>
    <!-- Rendered by React (components/shell/AppHeader.tsx): the app's name
         and repo, the view tabs, when the data was last updated and Quick
         check all. -->
    <div id="app-header-root"></div>
    <!-- Rendered by React (components/shell/AutoUpdatePausedBanner.tsx).
         Its own element directly in <body>, so it can stay stuck to the top
         of the window while you scroll (styles/shell.css). -->
    <div id="app-banner-root" class="app-banner-root"></div>

    <!-- The views; their tabs are in the app header. -->
    <div class="data-tabs" id="data-tabs">
        <section id="tab-panel-pr-data" class="data-tab-panel" role="tabpanel" aria-labelledby="tab-pr-data">
            <!-- Rendered by React (react-app.jsx, plain-string portal) -
                 starts empty, see #request-activity-details above. -->
            <pre id="data-meta" style="white-space: break-spaces;" role="region" aria-label="PR data summary"></pre>
            <!-- Rendered by React (components/filter-bar/FilterBar.tsx): the
                 row filters, a "Showing N of M" count and the applied
                 filters' chips. -->
            <div id="filter-bar-root"></div>
            <div id="pr-sections" role="region" aria-label="Pull requests"></div>
            <!-- Rendered by React (components/MergedRequestMoreAction.jsx) -
                 renders nothing at all (not even this div's own children)
                 when not visible, so no `hidden` attribute is needed here. -->
            <div id="merged-request-more-action" class="merged-request-more-action"></div>
        </section>

        <section id="tab-panel-review-stats" class="data-tab-panel" role="tabpanel" aria-labelledby="tab-review-stats"
            hidden>
            <div id="pr-stats" class="stats-panel">
                <!-- Rendered by React (react-app.jsx) - Phase 3, then Track C
                     (see REACT_MIGRATION_PLAN.md): ReviewStatsContent now computes
                     its own stats from PrDataContext's payload instead of being
                     pushed a pre-built result, so nothing outside React rebuilds
                     either #stats-controls-root or #stats-content-root anymore.
                     Starts empty (found and fixed alongside the full
                     vanilla-to-React sweep, REACT_MIGRATION_PLAN.md): the old
                     static "Loading..." text was never cleared before React
                     mounted here - createPortal doesn't clear a target's
                     pre-existing content, so the real stats content used to
                     render stuck directly onto the end of "Loading...". -->
                <div id="stats-controls-root" role="group" aria-label="Review statistics controls"></div>
                <div id="stats-content-root" role="region" aria-label="Review statistics"></div>
            </div>
        </section>

        <section id="tab-panel-author-insights" class="data-tab-panel" role="tabpanel"
            aria-labelledby="tab-author-insights" hidden>
            <div id="author-insights" class="author-insights-panel">
                <!-- Every container below is rendered by React (see the
                     matching mount*() function in react-app.jsx) and mounted
                     into once by createRoot() - Phase 3, see
                     REACT_MIGRATION_PLAN.md. renderAuthorInsights
                     (pr-author-insights.component.js) never rebuilds any of
                     these containers directly (no more `host.innerHTML = ""`
                     covering them all at once, the original vanilla
                     behavior); each is updated only via its own
                     window.updateAuthorInsights*() bridge call, or falls back
                     to appending a vanilla-built replacement into itself (or
                     the shared outer #author-insights host, for containers
                     without a persisted override) if React fails to
                     load/mount. -->
                <div id="author-insights-selector-root"></div>
                <div id="author-insights-header-root" role="region" aria-label="Selected author"></div>
                <!-- Manual comments composer/list - real JSX
                     (AuthorInsightsCommentsSection.jsx). Its mutable draft
                     state and save/edit POST side effects go through the
                     vanilla authorInsightsState bridges
                     (getAuthorInsightsComposerDraft/etc.) so the
                     auto-render-blocking feature can still see unsaved
                     edits, but rendering itself is fully React-owned. Starts
                     empty (found and fixed alongside the full
                     vanilla-to-React sweep, REACT_MIGRATION_PLAN.md): the
                     old static "Loading..." text was never cleared before
                     React mounted here - createPortal doesn't clear a
                     target's pre-existing content, so the real composer/list
                     content used to render stuck directly onto the end of
                     "Loading...". -->
                <div id="author-insights-content-root" role="region" aria-label="Author comments"></div>
                <div id="author-insights-notes-root" role="region" aria-label="Author's PR notes"></div>
                <div id="author-insights-created-prs-root" role="region" aria-label="Author's created PRs"></div>
            </div>
        </section>
    </div>

    <!-- Rendered by React (components/settings/SettingsDrawer.tsx): the
         Settings drawer, opened from the app header. -->
    <div id="settings-drawer-root"></div>

    <!-- Vendored copy of node_modules/marked/lib/marked.umd.js: both the Vite
         dev server and the standalone Express server serve static files
         rooted at src/ui, so a path into the repo-root node_modules/ 404s
         under either. Re-copy from node_modules/marked/lib/marked.umd.js
         when bumping the "marked" dependency version - and re-copy
         marked.umd.js.map (node_modules/marked/lib/marked.umd.js.map) at
         the same time, or Vite's dev server logs a source-map ENOENT for
         every request once the two drift out of sync (the .js file's own
         trailing `//# sourceMappingURL=marked.umd.js.map` comment expects
         it to sit right next to it). -->
    <script src="./vendor/marked.umd.js"></script>
    <!-- Vendored copy of node_modules/dompurify/dist/purify.min.js, for the
         same reason as marked.umd.js above (static files are served rooted
         at src/ui, so a node_modules/ path 404s). Sanitizes the HTML returned
         by the optional custom "More Insights" hook script (see
         InsightsHookSection.jsx / VIEW_PRS_INSIGHTS_HOOK_SCRIPT) before it's
         rendered - that script is user-provided and arbitrary, so its output
         is treated as untrusted. Re-copy purify.min.js and purify.min.js.map
         together when bumping the "dompurify" dependency version. -->
    <script src="./vendor/purify.min.js"></script>
    <!-- Window-bridge elimination Phase 7.5 (see WINDOW_BRIDGE_ELIMINATION_PLAN.md):
         index.page.js, the last vanilla script, is deleted. Its
         credential-field hints are props on the React inputs, its dropdown
         closing is AppRoot's useMultiSelectDropdownClosing, and its error
         filters are installed by react-app.jsx before mounting. -->

    <!-- React App Entry Point (Phase 1: Hybrid Migration) -->
    <script type="module" src="./react-app.jsx"></script>
</body>

</html>
